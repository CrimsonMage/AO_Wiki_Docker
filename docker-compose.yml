# docker compose up -d   ->  http://localhost:8080
# Port 8080 taken? Pick another: AO_WIKI_PORT=8081 docker compose up -d  (or put AO_WIKI_PORT=8081 in a .env file here)
services:
  ao-wiki:
    build: .
    image: ao-wiki
    container_name: ao-wiki
    ports:
      - "127.0.0.1:${AO_WIKI_PORT:-8080}:8080"
    restart: unless-stopped
